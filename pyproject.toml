[project]
name = "ppd-household-presets"
version = "0.1.0"
description = "Household privacy presets for PPD: synthetic households, clustering, onboarding decision tree"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "nbconvert>=7.16",
]

[tool.uv]
# All code lives in the notebooks; this file only pins their dependencies.
package = false
