# Synthetic households: every number the generator uses, with where its direction comes from.
# Sources (full citations in README.md):
#   N17 = Emami-Naeini et al. 2017, Privacy Expectations and Preferences in an IoT World (SOUPS)
#   N20 = Emami-Naeini et al. 2020, Ask the Experts: What Should Be on an IoT Privacy and Security Label? (S&P)
#   N21 = Emami-Naeini et al. 2021, Which Privacy and Security Attributes Most Impact Consumers' Risk Perception
#         and Willingness to Purchase IoT Devices? (S&P)
# The studies give directions (what raises or lowers comfort), not magnitudes for the PPD taxonomy. Magnitudes
# here are our choices; notebooks/06_sensitivity (planned) varies them to show how much the results depend on them.

seed: 20261023
n_households: 5000

# Latent traits, each in 0..1. Drawn together through a Gaussian copula (so they can be correlated), then
# mapped to the Beta(a, b) marginal given here.
traits:
  concern:               {beta: [2.0, 2.0]}  # general privacy concern
  vendor_trust:          {beta: [3.0, 2.0]}  # trust in the device maker; N21: "device function" purpose often not trusted
  third_party_aversion:  {beta: [5.0, 2.0]}  # N21: sold to third parties raised risk most; N20: all 15 consumers worried about sharing
  inference_aversion:    {beta: [3.0, 2.0]}  # N17: inference lowered comfort
  retention_sensitivity: {beta: [3.0, 2.0]}  # N17: only short retention clearly raised comfort; N21: no cloud retention lowered risk most
  benefit_orientation:   {beta: [2.5, 2.0]}  # N17: benefit to the user raised willingness

# Correlations between traits on the copula scale (symmetric; unlisted pairs are 0).
trait_correlation:
  concern|vendor_trust: -0.4
  concern|third_party_aversion: 0.5
  concern|inference_aversion: 0.5
  concern|retention_sensitivity: 0.4
  concern|benefit_orientation: -0.3
  third_party_aversion|inference_aversion: 0.3

household:
  children_rate: 0.35  # share of households with children living in or visiting often (N20: children's data on the label)

# How sensitive each kind of data is before a household's own variation (0..1). N17: biometric/video least comfortable.
data_type_sensitivity:
  base:
    ppd:contentData: 0.85
    ppd:locationData: 0.75
    ppd:identifierData: 0.70
    ppd:profileData: 0.60
    ppd:sensorData: 0.45
    ppd:usageData: 0.40
    ppd:deviceAndNetworkData: 0.25
  concern_shift: 0.30    # each household's sensitivities move up with concern: base + shift * (concern - 0.5)
  noise_sd: 0.15         # per household, per data type
  children_bonus:        # households with children are more careful with these
    ppd:contentData: 0.15
    ppd:locationData: 0.15

# How much each purpose benefits the household (-1..1). N17: user benefit and specific purposes raised willingness.
purpose_benefit:
  ppd:coreFunctionality: 1.0
  ppd:security: 0.9
  ppd:communicationsAndNotifications: 0.7
  ppd:diagnosticsAndMaintenance: 0.5
  ppd:legalCompliance: 0.5
  ppd:personalization: 0.4
  ppd:analyticsAndImprovement: 0.1
  ppd:advertisingAndMarketing: -0.5

# Exposure: how far the data goes. Home flows are low; leaving the home scales with the recipient.
# Each term is base + weight * trait (trait optional).
exposure:
  home_base: 0.10            # a flow that stays in the household context
  away_base: 0.30            # any flow that leaves it, before the recipient term
  recipient:
    ppd:householdContext: {base: 0.0}
    ppd:vendorContext:    {base: 1.0, trait: vendor_trust, weight: -1.0}         # less trust in the maker, more exposure
    ppd:thirdPartyContext: {base: 0.5, trait: third_party_aversion, weight: 0.7}
    ppd:publicAudience:   {base: 1.5}
  action:
    ppd:collection: {base: 0.0}
    ppd:use:        {base: 0.0}
    ppd:transfer:   {base: 0.3}                                                   # N21: sharing/selling lowered comfort
    ppd:inference:  {base: 0.2, trait: inference_aversion, weight: 0.8}           # N17: inference lowered comfort
  home_action_scale: 0.5     # actions inside the home count half

# Small adjustment by where the data comes from (+ is less comfortable).
source_term:
  ppd:userProvided: -0.10        # the person typed it in knowingly
  ppd:householdProvided: 0.00
  ppd:participantGenerated: 0.05
  ppd:vendorProvided: -0.05
  ppd:participantObserved: 0.15  # passive sensing
  ppd:thirdPartyProvided: 0.20
  ppd:derivedFromPriorData: 0.25 # derived, like inference

# u = intercept + benefit_weight * benefit[purpose] * (0.5 + benefit_orientation)
#     - risk_weight * sensitivity[data_type] * exposure * (0.6 + concern) - source_term + noise
# allow if u >= 0; otherwise the smallest limit that lifts u to >= 0; otherwise deny.
utility:
  intercept: 0.9
  benefit_weight: 1.0
  risk_weight: 1.8
  noise_sd: 0.30

# What each modifier is worth (it must lift u above 0 to turn a deny into "allow if limited").
limits:
  ephemeral_gain: 0.9    # x retention_sensitivity x sensitivity; N17/N21: short or no retention helps
  ephemeral_home_scale: 0.3  # keeping data matters less when it stays home
  in_home_removes: 0.8   # use/inference only: removes this share of the recipient exposure
  on_device_removes: 1.0 # use/inference only: removes all of it

# Questionnaire answers come from the same traits plus this noise (people don't answer exactly in line with
# their preferences). Raise it to test how robust the onboarding tree is.
answer_noise: 0.12
